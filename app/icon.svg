<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Browser-tab mark. Same drawing as components/logo.tsx, with two changes a
    16px favicon needs: a dark rounded plate behind it, because the tab strip
    can be light or dark and a bare glyph disappears into one of them, and the
    roads at full opacity instead of 55%, since a faint stroke is the first
    thing to vanish when this is scaled to a third of its size.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0f17"/>
  <path d="M20.2 12.8C23 10.4 24.2 9.2 25.9 7.9" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M11.8 19.2C9 21.6 7.8 22.8 6.1 24.1" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="26.6" cy="7.1" r="2.7" fill="#94a3b8"/>
  <circle cx="5.4" cy="24.9" r="2.7" fill="#94a3b8"/>
  <circle cx="16" cy="16" r="9.2" fill="#38bdf8"/>
  <path d="M11 18.6 9.9 12.2l3.5 2.6L16 10.9l2.6 3.9 3.5-2.6-1.1 6.4z" fill="#0b0f17"/>
  <path d="M11.4 20.4h9.2" stroke="#0b0f17" stroke-width="1.7" stroke-linecap="round"/>
</svg>
